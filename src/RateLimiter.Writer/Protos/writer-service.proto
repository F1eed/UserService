syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "Itmo.HighLoad.RateLimiter.Writer";

package writer;

service Writer {
  rpc CreateLimit (CreateLimitRequest) returns (CreateLimitResponse);
  rpc GetLimitByRoute (GetLimitRequest) returns (GetLimitResponse);
  rpc UpdateLimit (UpdateLimitRequest) returns (UpdateLimitResponse);
  rpc DeleteLimit (DeleteLimitRequest) returns (google.protobuf.Empty);
}

message CreateLimitRequest {
  RateLimit rate_limit = 1;
}

message CreateLimitResponse {
  RateLimit rate_limit = 1;
}

message RateLimit {
  string route = 1;
  int64 requests_per_minute = 2;
}

message GetLimitRequest {
  string route = 1;
}

message GetLimitResponse {
  RateLimit rate_limit = 1;
}

message UpdateLimitRequest {
  string route = 1;
  optional RateLimit rate_limit = 2;
}

message UpdateLimitResponse {
  string reply = 1;
}

message DeleteLimitRequest {
  string route = 1;
}