syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "UserService.Presentation.Grpc";

package users;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserReply);
  rpc GetUserById (GetUserByIdRequest) returns (GetUserReply);
  rpc GetUserByName (GetUserByNameRequest) returns (GetUserReply);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserReply);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserReply);
}

message CreateUserRequest {
  string login = 1;
  string password = 2;
  string name = 3;
  string surname = 4;
  google.protobuf.Timestamp age = 5;
}

message CreateUserReply {
  string message = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserReply {
  User user = 1;
}

message GetUserByNameRequest {
  string name = 1;
  string surname = 2;
}

message UpdateUserRequest {
  string password = 1;
  string name = 2;
  string surname = 3;
  google.protobuf.Timestamp age = 4;
}

message UpdateUserReply {
  string message = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserReply {
  string message = 1;
}

message User {
  string login = 1;
  string name = 2;
  string surname = 3;
  google.protobuf.Timestamp age = 4;
}