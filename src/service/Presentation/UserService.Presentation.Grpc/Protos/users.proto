syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "UserService.Presentation.Grpc";

package users;

service UserService {
  rpc CreateUsers (CreateUsersRequest) returns (google.protobuf.Empty);
  rpc GetUserById (GetUserByIdRequest) returns (GetUserResponse);
  rpc GetUsersByName (GetUsersByNameRequest) returns (GetUsersResponse);
  rpc UpdateUser (UpdateUserRequest) returns (google.protobuf.Empty);
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty);
}

message CreateUsersRequest {
  repeated CreateUserEntry Entries = 1;
}

message CreateUserEntry {
  string login = 1;
  string password = 2;
  string name = 3;
  string surname = 4;
  google.protobuf.Timestamp birth_date = 5;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersByNameRequest {
  string name = 1;
  string surname = 2;
}

message GetUsersResponse {
  repeated User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  google.protobuf.StringValue password = 2;
  google.protobuf.StringValue name = 3;
  google.protobuf.StringValue surname = 4;
  google.protobuf.Timestamp birth_date = 5;
}

message DeleteUserRequest {
  string id = 1;
}

message User {
  string login = 1;
  string password = 2;
  string name = 3;
  string surname = 4;
  google.protobuf.Timestamp birth_date = 5;
}